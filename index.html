h+='<div class="sec">Derniers envois</div><div class="card">'+S.hist.slice(0,3).map(hrow).join('')+'</div>';
}else if(S.tab==='det'){h+=detui();}else if(S.tab==='dep'||S.tab==='ret'){h+=cashui();}else if(S.tab==='hist'){
h+='<h2>Historique</h2><div class="card">'+(S.hist.length?S.hist.map(hrow).join(''):'Aucun envoi pour le moment.')+'</div>';
}else{

h+='<div class="sum" id="sum">'+sum(c)+'</div></div><p class="note">'+(S.live?'Taux en direct, mis à jour chaque minute.':'Taux BCE du 26 oct. 2026 ; autres devises : relevés de marché du 27 oct. ou parités fixes officielles.')+' Le taux réellement appliqué peut différer. Pays et modes de réception à titre indicatif. Aucun argent réel n’est transféré.</p>';

}else if(S.step===2){
h+='<button class="back" id="b2">‹ Retour</button><h2>Qui reçoit ?</h2>'+bl()+'<div class="card"><label for="nm">Nom complet</label><input class="txt" id="nm" autocomplete="off" value="'+esc(S.name)+'" placeholder="Ex. Yasmine Benali"><label for="ac">'+aclabel()+'</label><input class="txt" id="ac" autocomplete="off" value="'+esc(S.acct)+'" placeholder="'+acph()+'" style="margin:0"><div class="note" id="hint" style="margin:6px 0 0"></div><label style="display:flex;gap:8px;align-items:center;margin:14px 0 0;font-size:14px"><input type="checkbox" id="sv"'+(S.save?' checked':'')+'> Enregistrer ce bénéficiaire</label></div><button class="btn" id="n2" disabled>Vérifier l’envoi</button>';
}else if(S.step===3){
h+='<button class="back" id="b3">‹ Retour</button><h2>Vérifiez avant d’envoyer</h2>'+alerts()+'<div class="card"><div class="row"><div class="av">'+ini(S.name)+'</div><div class="t"><b>'+esc(S.name)+'</b><span>'+esc(S.acct)+'</span></div></div><div class="sum"><div><span>Destination</span><b>'+PAYS[S.ci][0]+' · '+esc(S.meth)+'</b></div><div><span>Montant envoyé</span><b>'+m(c.a)+'</b></div><div><span>Frais</span><b>'+m(c.fee)+'</b></div><div><span>Total débité</span><b>'+m(c.tot)+'</b></div><div><span>Arrivée estimée</span><b>'+dly()+'</b></div></div><label>Montant reçu</label><div class="get">'+f(c.get,S.cur==='XOF'||S.cur==='NGN'?0:2)+' '+lab(S.cur)+'</div></div><button class="btn" id="n3">Confirmer et envoyer</button>';
}else{
h+='<div class="ok"><div class="ck">✓</div><h2 style="margin:0 0 6px">Envoi confirmé</h2><p style="margin:0 0 6px">'+esc(S.name)+' recevra '+f(S.last.g,S.cur==='XOF'||S.cur==='NGN'?0:2)+' '+(S.cur==='XOF'?'FCFA':S.cur)+' · arrivée : '+dly().toLowerCase()+'.</p><small>Référence '+S.ref+'</small></div><div style="height:16px"></div><button class="btn ghost" id="trk" style="margin-bottom:10px">Suivre l’envoi</button><button class="btn ghost" id="shr" style="margin-bottom:10px">Partager le reçu</button><button class="btn" id="n4">Terminer</button>';
}}
v.innerHTML=h;bind();window.scrollTo(0,0)}
function sum(c){return '<div><span>Frais (0,9 % + 1 €)</span><b>'+m(c.fee)+'</b></div><div><span>Taux</span><b>'+(CUR[S.cur]?(S.base==='XOF'?1000:1)+' '+SY[S.base]+' = '+f((S.base==='XOF'?1000:1)*CUR[S.cur].r/CUR[S.base].r,S.base==='XOF'?2:4)+' '+S.cur:'indisponible hors mode direct')+'</b></div><div><span>Total débité</span><b>'+m(c.tot)+'</b></div>'+meter(c)}
function $(i){return document.getElementById(i)}
function bind(){
if(S.tab==='dep'||S.tab==='ret')cbind();
if($('lk'))$('lk').onclick=startlock;
document.querySelectorAll('[data-det]').forEach(function(x){x.onclick=function(e){if(e.target.closest('[data-again]'))return;S.di=+x.dataset.det;S.tab='det';render()}});
if($('dbk'))$('dbk').onclick=function(){S.tab='hist';render()};
if($('trk'))$('trk').onclick=function(){S.di=0;S.tab='det';render()};
document.querySelectorAll('[data-again]').forEach(function(x){x.onclick=function(){var h=S.hist[+x.dataset.again];if(!h)return;var j=PAYS.findIndex(function(p){return p[0]===h.k});if(j<0)return;if(h.b&&h.b!==S.base){BAL[S.base]=S.bal;S.base=h.b;S.bal=BAL[S.base]}pick(j);if(h.m)S.meth=h.m;S.name=h.n;S.acct=h.ac||'';S.amt=String(h.e);S.tab='send';S.step=1;render()}});
if($('shr'))$('shr').onclick=function(){var L=S.last,d=L.b==='XOF'?0:2,t='Reçu Passerelle\nRéférence : '+S.ref+'\nBénéficiaire : '+L.n+' ('+L.k+')\nMontant envoyé : '+f(L.e,d)+' '+SY[L.b]+'\nFrais : '+f(L.fee,d)+' '+SY[L.b]+'\nMontant reçu : '+f(L.g,2)+' '+L.c;if(navigator.share)navigator.share({text:t}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){$('shr').textContent='Reçu copié ✓'}).catch(function(){})};
document.querySelectorAll('[data-tab]').forEach(function(x){x.onclick=function(){S.tab=x.dataset.tab;S.step=1;S.cx=null;render()}});
document.querySelectorAll('[data-ben]').forEach(function(x){x.onclick=function(){var b=S.ben.filter(function(y){return y.id===x.dataset.ben})[0];if(!b)return;S.cur=b.cur;S.ci=Math.max(0,PAYS.findIndex(function(p){return p[1]===b.cur}));S.meth=PAYS[S.ci][2].split('|')[0];var j=b.k?PAYS.findIndex(function(p){return p[0]===b.k}):-1;if(j>=0){pick(j);if(b.m)S.meth=b.m}S.name=b.name;S.acct=b.acct;S.tab='send';S.step=1;render()}});
document.querySelectorAll('[data-fill]').forEach(function(x){x.onclick=function(){var b=S.ben.filter(function(y){return y.id===x.dataset.fill})[0];if(!b)return;S.name=b.name;S.acct=b.acct;render()}});
document.querySelectorAll('[data-del]').forEach(function(x){x.onclick=function(){if($('nm')){S.name=$('nm').value;S.acct=$('ac').value}S.ben=S.ben.filter(function(y){return y.id!==x.dataset.del});sb();render()}});
if($('sv'))$('sv').onchange=function(){S.save=this.checked};
document.querySelectorAll('[data-base]').forEach(function(x){x.onclick=function(){BAL[S.base]=S.bal;S.base=x.dataset.base;S.bal=BAL[S.base];S.amt=S.base==='XOF'?'100000':S.base==='EUR'?'150':'170';render()}});
document.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){S.tab='send';S.step=1;render()}});
document.querySelectorAll('[data-pick]').forEach(function(b){b.onclick=function(){S.cur=b.dataset.pick;S.ci=Math.max(0,PAYS.findIndex(function(p){return p[1]===S.cur}));S.meth=PAYS[S.ci][2].split('|')[0];S.tab='send';S.step=1;render()}});
if($('amt')){$('amt').oninput=function(){S.amt=this.value;var c=calc();$('get').textContent=f(c.get,S.cur==='XOF'||S.cur==='NGN'?0:2);$('sum').innerHTML=sum(c);var bad=c.tot>S.bal;$('n1').disabled=c.a<1||bad||c.nr;$('err').textContent=bad?'Solde insuffisant pour ce montant.':(c.lim||'')};

if($('b3')){$('b3').onclick=function(){S.step=2;render()};$('n3').onclick=function(){if(!this.dataset.sent&&!S.pinok){var self=this;needpin(function(){S.pinok=true;self.onclick();S.pinok=false});return}var c=calc();if((S.live||AC)&&!this.dataset.sent){var bt=this;bt.dataset.sent=1;bt.disabled=true;http('POST','/api/transfers',{from:S.base,to:S.cur,amount:c.a,country:PAYS[S.ci][0],method:S.meth,name:S.name,account:S.acct,pin:PINV,key:'k'+Date.now()}).then(function(j){if(j&&(j.error||j.status==='failed')){bt.disabled=false;delete bt.dataset.sent;if(j._s===401){authflow('Session expirée, reconnectez-vous.');return}bt.textContent=(j.error||j.reason)+' — réessayer';return}S.srv=j&&j.ref?j.ref:null;S.srvg=j&&j.received?j.received:null;bt.disabled=false;bt.onclick()}).catch(function(){if(AC){bt.disabled=false;delete bt.dataset.sent;bt.textContent='Connexion impossible — réessayer';return}S.srv=null;bt.disabled=false;bt.onclick()});return}if(!AC)S.bal=Math.round((S.bal-c.tot)*100)/100;S.ref=S.srv||('PSG-'+Math.random().toString(36).slice(2,8).toUpperCase());S.srv=null;S.last={n:S.name,c:S.cur,b:S.base,e:c.a,g:S.srvg||c.get,k:PAYS[S.ci][0],m:S.meth,ac:S.acct,fee:c.fee,st:'processing',rf:S.ref,d:'Aujourd’hui'};if(!AC){S.hist.unshift(S.last);track(S.last);S.use.push({t:Date.now(),e:c.a/CUR[S.base].r})}S.srvg=null;if(S.save&&!S.ben.some(function(b){return b.acct===S.acct.trim()&&b.cur===S.cur})){S.ben.push({id:'b'+Date.now(),name:S.name.trim(),acct:S.acct.trim(),cur:S.cur,k:PAYS[S.ci][0],m:S.meth});sb()}S.step=4;render();if(AC)refreshAll()}}

document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){S.tab=b.dataset.t;S.step=1;S.cx=null;render()}});
